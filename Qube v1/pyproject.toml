[project]
name = "firmware-update-qube-esp32"
version = "0.1.0"
description = "Plataforma QUBE Servo Modernizada con ESP32 — firmware, GUI y análisis experimental"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib>=3.8.0",
    "requests>=2.28.0",
    "mcp[cli]>=1.27.1",
    "stable-baselines3>=2.9.0",
    "gymnasium>=1.3.0",
    "scipy>=1.17.1",
    "tqdm>=4.68.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
viz = [
    "matplotlib>=3.8.0",
]
rl = [
    "stable-baselines3>=2.2.1",
    "gymnasium>=0.29.1",
    "torch>=2.8.0",
    "scipy>=1.11.4",
]
tracking = [
    "mlflow>=2.10",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# experiments/ holds throwaway bench/run scripts; CI lints only src+tests.
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modernize Python)
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = [
    "ARG001",   # allow unused arguments in tests (fixtures)
    "S101",     # allow assert in tests
]
# Control-theory code uses standard uppercase matrix notation (A, B, Q, R, K, S).
"src/qube_rl/lqr.py" = ["N803", "N806"]
# System-ID uses standard physics symbols (Mp, Lp, Dp, J) for the pendulum params.
"src/qube_analysis/sysid.py" = ["N803", "N806"]
"tests/test_sysid.py" = ["N806"]
# MCP tool docstrings/strings intentionally use Greek θ/α for pendulum angles.
"mcp/*.py" = ["RUF001", "RUF002", "RUF003"]
# La demo imprime prosa en castellano: °, ×, – y — son tipografia intencional.
"demo/*.py" = ["RUF001", "RUF002", "RUF003"]
# El CLI del DAQ rotula ejes con los simbolos del proyecto (θ, α): son intencionales.
"src/qube_daq/__main__.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.0.0",
    "pyright>=1.1.380",
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qube_rl", "src/qube_analysis", "src/qube_daq"]
