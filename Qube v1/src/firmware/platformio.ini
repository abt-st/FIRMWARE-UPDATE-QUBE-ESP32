; ──────────────────────────────────────────────────────────────────────────────
;  PlatformIO Configuration — QUBE Servo ESP32
;  Build: pio run
;  Upload: pio run --target upload
;  Monitor: pio device monitor
; ──────────────────────────────────────────────────────────────────────────────

[platformio]
src_dir = esp32_qube

[env:esp32dev]
platform = espressif32@5.4.0
board = esp32dev
framework = arduino

; ── Monitor serial ──────────────────────────────────────────────────────────
monitor_speed = 115200

; ── Upload settings ─────────────────────────────────────────────────────────
upload_speed = 921600

; ── Dependencies ────────────────────────────────────────────────────────────
lib_deps = 
    wollewald/INA219_WE @ ^1.4.1
    ESP Async WebServer @ ^1.2.3
    AsyncTCP @ ^1.1.1

; ── Build flags ─────────────────────────────────────────────────────────────
build_flags = 
    -DCORE_DEBUG_LEVEL=3

; ── Filesystem (SPIFFS for web GUI) ────────────────────────────────────────
board_build.filesystem = spiffs
; ── Partition scheme (default 4MB) ──────────────────────────────────────────
board_build.partitions = default.csv

; ── Test configuration ──────────────────────────────────────────────────────
; test_encoder_pulse_loss requiere puentear GPIO18->23 y GPIO19->22 con jumpers,
; asi que no puede correr desatendido. Se excluye del `pio test` por defecto;
; para correrlo en banco (con los jumpers puestos):
;     pio test -e esp32dev_debug -f test_encoder_pulse_loss
test_ignore = test_encoder_pulse_loss

; ── Linting (clang-tidy) ────────────────────────────────────────────────────
; Set acotado a proposito: `--checks=*` junto con `--warnings-as-errors=*` no
; puede pasar nunca sobre codigo Arduino (arrastra fuchsia-*, llvmlibc-*,
; altera-*, y el propio framework). Estos tres grupos son los que encuentran
; defectos reales en este firmware sin ahogar la salida en ruido de estilo.
check_tool = clangtidy
check_skip_packages = yes
check_flags =
    --checks=-*,bugprone-*,clang-analyzer-*,performance-*,readability-misleading-indentation,readability-braces-around-statements

; ── Environment for development ──────────────────────────────────────────────
[env:esp32dev_debug]
extends = env:esp32dev
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_MODE=1

; ── AP+STA (rol de radio anterior) ──────────────────────────────────────────
; El firmware arranca en SoftAP PURO por defecto (ENABLE_STA=0 en esp32_qube.ino).
; Este entorno reconstruye el comportamiento anterior — SoftAP + cliente del router
; en 192.168.100.50 — sin editar el fuente, que es lo que permite correr el A/B de
; latencia de docs/research/softap_app_escritorio.md §9 alternando corridas:
;     pio run -e esp32dev_apsta --target upload
[env:esp32dev_apsta]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DQUBE_ENABLE_STA=1

; ── OTA upload (WiFi) ───────────────────────────────────────────────────────
; En SoftAP puro el PC debe estar ASOCIADO a la red QUBE-ESP32 para poder flashear.
; Para un firmware AP+STA, sobrescribir el destino:
;     pio run -e esp32dev_ota --target upload --upload-port 192.168.100.50
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=