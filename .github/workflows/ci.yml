name: CI

on:
  push:
    branches: [main, master, DRL_IMP]
  pull_request:

jobs:
  python:
    name: Lint & Test (${{ matrix.qube }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qube: ['Qube v1', 'Qube v2']
    defaults:
      run:
        working-directory: ${{ matrix.qube }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: System libs for headless Qt (v2 only)
        if: matrix.qube == 'Qube v2'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          if [ '${{ matrix.qube }}' = 'Qube v2' ]; then
            uv sync --extra test --extra tracking --extra app
          else
            uv sync --extra test --extra tracking
          fi

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest -q

  firmware:
    name: Build ESP32 (${{ matrix.qube }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qube: ['Qube v1', 'Qube v2']
    defaults:
      run:
        working-directory: ${{ matrix.qube }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ matrix.qube }}-${{ hashFiles('src/firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-${{ matrix.qube }}-

      - name: Provide placeholder credentials.h
        run: cp src/firmware/esp32_qube/credentials.h.example src/firmware/esp32_qube/credentials.h

      - name: Build firmware
        run: pio run -e esp32dev
        working-directory: src/firmware