name: CI

on:
  push:
    branches: [main, DRL_IMP]
  pull_request:

jobs:
  python:
    name: Lint & Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test --extra tracking

      # Scoped to the packages cleaned in this pass. gui/ and mcp/ still carry
      # pre-existing lint debt; widen this once they are cleaned.
      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pytest
        run: uv run pytest -q
