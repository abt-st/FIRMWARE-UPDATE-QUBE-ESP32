<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUBE ESP32 Control</title>
<link rel="icon" href="data:,">
<script src="chart.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#c9d1d9;padding:12px;overflow-x:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.topbar h1{font-size:1.2rem;color:#58a6ff}
.topbar button{font-size:.75rem;padding:4px 12px}
.status{padding:5px 10px;border-radius:6px;font-size:.8rem;display:inline-block}
.status.ok{background:#0d2818;border:1px solid #238636}
.status.err{background:#2d1117;border:1px solid #da3633}
.main{display:flex;gap:10px}
.left{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.right{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 60px);overflow-y:auto}
.chart-box{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:6px 8px 4px;position:relative;height:calc((100vh - 100px)/4)}
.chart-box h3{font-size:.7rem;color:#8b949e;margin-bottom:2px}
.chart-box canvas{display:block}
.panel{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 10px}
.panel h2{font-size:.8rem;color:#58a6ff;margin-bottom:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.row label{font-size:.75rem;color:#8b949e;min-width:50px}
input[type=number]{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:3px 6px;border-radius:4px;width:60px;font-size:.8rem}
select{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:3px 6px;border-radius:4px;font-size:.8rem}
button{background:#238636;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.75rem}
button:hover{background:#2ea043}
button.danger{background:#da3633}
button.danger:hover{background:#f85149}
button.secondary{background:#30363d;color:#c9d1d9}
button:disabled{opacity:.4;cursor:default}
.ota-bar{width:100%;height:14px;background:#0d1117;border:1px solid #30363d;border-radius:4px;overflow:hidden;margin:4px 0}
.ota-fill{height:100%;width:0%;background:#58a6ff;transition:width .2s;border-radius:3px}
.ota-status{font-size:.7rem;color:#8b949e;margin-top:2px}
.grow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.gi{display:flex;align-items:center;gap:3px;font-size:.75rem}
.gi label{min-width:22px;text-align:right}
.gi input{width:48px}
.grow .ok-btn{margin-left:auto}
@media(max-width:800px){.main{flex-direction:column}.right{width:100%;max-height:none}.chart-box{height:200px}}
</style>
</head>
<body>

<div class="topbar">
  <h1>QUBE ESP32</h1>
  <span class="status err" id="status">Desconectado</span>
</div>

<div class="main">
<div class="left">
  <div class="chart-box"><h3>Servo (grados)</h3><canvas id="chS"></canvas></div>
  <div class="chart-box"><h3>Péndulo (grados)</h3><canvas id="chP"></canvas></div>
  <div class="chart-box"><h3>PWM</h3><canvas id="chW"></canvas></div>
  <div class="chart-box"><h3>Potencia (mW)</h3><canvas id="chPw"></canvas></div>
</div>

<div class="right">
<div class="panel">
  <h2>Control</h2>
  <div class="row">
    <label>Modo:</label>
    <select id="mode"><option value="0" selected>STOP</option><option value="1">PWM</option><option value="2">PID Servo</option><option value="4">LQR</option><option value="5">Swing-up</option><option value="6">Deep RL (HTTP)</option><option value="7">Deep RL (chip)</option></select>
    <button onclick="cmd('m='+el('mode').value)">Aplicar</button>
    <button class="danger" onclick="cmd('x=1')">STOP</button>
  </div>
  <div class="row">
    <label>SP S:</label><input type="number" id="sp" value="0" step="1">
    <button onclick="cmd('m=2&s='+el('sp').value);el('mode').value='2'">Set Servo</button>
  </div>
  <div class="row">
    <label>PWM:</label><input type="number" id="pwm" value="0" step="10" min="-255" max="255">
    <button onclick="cmd('p='+el('pwm').value)">Aplicar</button>
  </div>
  <div class="row">
    <button onclick="cmd('z=1')">Zero S</button>
    <button onclick="cmd('zp=1')">Zero P</button>
    <button onclick="cmd('r=1')">Reset</button>
    <span style="font-size:.65rem;color:#8b949e" id="csvInfo"></span>
  </div>
</div>


<div class="panel">
  <h2>Recolecci&oacute;n de datos</h2>
  <div class="row">
    <button id="btnRec" onclick="toggleRec()">&#9679; Grabar</button>
    <button class="secondary" id="btnCSV" onclick="exportCSV()" disabled>Exportar CSV</button>
    <button class="danger" onclick="clearRec()">Borrar</button>
  </div>
  <div style="font-size:.7rem;color:#8b949e;margin-top:4px">
    <span id="recSt">Listo</span> &mdash; <span id="recCount">0</span> muestras &mdash; <span id="recTime">0.0 s</span>
  </div>
</div>

<div class="panel">
  <h2>PID Servo</h2>
  <div class="grow">
    <div class="gi"><label>Kp</label><input type="number" id="kp" value="3.0" step="0.1"></div>
    <div class="gi"><label>Ki</label><input type="number" id="ki" value="0.5" step="0.1"></div>
    <div class="gi"><label>Kd</label><input type="number" id="kd" value="0.15" step="0.01"></div>
    <button class="ok-btn" onclick="cmd('kp='+el('kp').value+'&ki='+el('ki').value+'&kd='+el('kd').value)">OK</button>
  </div>
</div>

<div class="panel">
  <h2>LQR</h2>
  <div class="grow">
    <div class="gi"><label>K1</label><input type="number" id="l1" value="1.0" step="0.5"></div>
    <div class="gi"><label>K2</label><input type="number" id="l2" value="25.0" step="1"></div>
    <div class="gi"><label>K3</label><input type="number" id="l3" value="0.5" step="0.1"></div>
    <div class="gi"><label>K4</label><input type="number" id="l4" value="3.0" step="0.5"></div>
    <button class="ok-btn" onclick="cmd('lqr1='+el('l1').value+'&lqr2='+el('l2').value+'&lqr3='+el('l3').value+'&lqr4='+el('l4').value)">OK</button>
  </div>
</div>

<div class="panel">
  <h2>Swing-up</h2>
  <div class="grow">
    <div class="gi"><label>Ke</label><input type="number" id="ke" value="0.5" step="0.1"></div>
    <div class="gi"><label>Thr</label><input type="number" id="bt" value="20" step="1"></div>
    <button class="ok-btn" onclick="cmd('ke='+el('ke').value+'&bt='+el('bt').value)">OK</button>
  </div>
</div>
<div class="panel">
  <h2>Deep RL</h2>
  <div class="row">
    <span style="font-size:.7rem;color:#8b949e" id="rlInfo">theta: -- | alpha: --</span>
  </div>
  <div class="grow">
    <div class="gi"><label>a</label><input type="number" id="rlAct" value="0.0" step="0.1" min="-1.0" max="1.0"></div>
    <button onclick="rlCmd('a='+el('rlAct').value)">Send</button>
    <button onclick="rlCmd('r=1');el('rlInfo').textContent='Reset OK'" class="secondary">Reset</button>
  </div>
  <div class="grow">
    <button onclick="cmd('m=6');el('mode').value='6'">Set Mode 6</button>
    <button onclick="rlPoll()" class="secondary">Read State</button>
  </div>
</div>

<div class="panel">
  <h2>Gain Scheduling</h2>
  <div class="grow">
    <label style="font-size:.75rem;color:#8b949e">Activo:</label>
    <select id="gs"><option value="0">OFF</option><option value="1">ON</option></select>
    <button class="ok-btn" onclick="cmd('gs='+el('gs').value)">OK</button>
  </div>
  <div style="font-size:.7rem;color:#58a6ff;margin:4px 0 2px">Modo Fino (|err| &le; 10&deg;)</div>
  <div class="grow">
    <div class="gi"><label>Kp</label><input type="number" id="kpf" value="2.0" step="0.1"></div>
    <div class="gi"><label>Ki</label><input type="number" id="kif" value="0.8" step="0.1"></div>
    <div class="gi"><label>Kd</label><input type="number" id="kdf" value="0.2" step="0.05"></div>
    <button class="ok-btn" onclick="cmd('kpf='+el('kpf').value+'&kif='+el('kif').value+'&kdf='+el('kdf').value)">OK</button>
  </div>
  <div style="font-size:.7rem;color:#58a6ff;margin:4px 0 2px">Modo Grueso (|err| &gt; 10&deg;)</div>
  <div class="grow">
    <div class="gi"><label>Kp</label><input type="number" id="kpc" value="4.0" step="0.5"></div>
    <div class="gi"><label>Ki</label><input type="number" id="kic" value="0.2" step="0.1"></div>
    <div class="gi"><label>Kd</label><input type="number" id="kdc" value="0.1" step="0.05"></div>
    <button class="ok-btn" onclick="cmd('kpc='+el('kpc').value+'&kic='+el('kic').value+'&kdc='+el('kdc').value)">OK</button>
  </div>
</div>

<div class="panel">
  <h2>Firmware OTA</h2>
  <div class="row">
    <input type="file" id="otaFile" accept=".bin" style="font-size:.7rem;color:#c9d1d9;max-width:180px">
    <button onclick="doOTA()">Flashear</button>
  </div>
  <div class="ota-bar"><div class="ota-fill" id="otaFill"></div></div>
  <div class="ota-status" id="otaSt">Seleccion&aacute; un .bin</div>
</div>

</div>
</div>

<script>
var el=function(id){return document.getElementById(id)};
var st=el('status');
var t0=Date.now(),rows=[],MAX=200;

/* ── Recording ─────────────────────────────────────────────── */
var recording=false,recStart=0,recTimer=null;

function updateRecUI(){
  el('recCount').textContent=rows.length;
  if(recording){
    el('recSt').innerHTML='&#9679; Grabando';
    el('recSt').style.color='#da3633';
    el('btnRec').innerHTML='&#9632; Detener';
    el('btnRec').style.background='#da3633';
    el('recTime').textContent=((Date.now()-recStart)/1000).toFixed(1)+' s';
  }else{
    el('recSt').textContent=rows.length?'Pausado':'Listo';
    el('recSt').style.color='#8b949e';
    el('btnRec').innerHTML='&#9679; Grabar';
    el('btnRec').style.background='';
    if(rows.length){
      el('recTime').textContent=((rows[rows.length-1]._ms-recStart)/1000).toFixed(1)+' s';
    }else{
      el('recTime').textContent='0.0 s';
    }
  }
  el('btnCSV').disabled=!rows.length;
}

function toggleRec(){
  if(recording){
    recording=false;
    clearInterval(recTimer);recTimer=null;
  }else{
    rows=[];
    recording=true;
    recStart=Date.now();
    recTimer=setInterval(updateRecUI,200);
  }
  updateRecUI();
}
function clearRec(){
  recording=false;
  if(recTimer){clearInterval(recTimer);recTimer=null;}
  rows=[];
  updateRecUI();
}
function exportCSV(){
  if(!rows.length)return;
  var COLS=['time_s','mode','position_deg','setpoint_deg','pend_position_deg','pwm','voltage_v','current_mA','power_mW'];
  var lines=[COLS.join(';')];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    lines.push(COLS.map(function(c){return r[c]===undefined?'':r[c];}).join(';'));
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='qube_'+new Date().toISOString().slice(0,19).replace(/[:-]/g,'')+'.csv';
  a.click();
}

/* ── Charts ────────────────────────────────────────────────── */
function mkC(id,col,yMin,yMax){
  if(typeof Chart==='undefined')return null;
  var yAxis={ticks:{color:'#8b949e',font:{size:10}},grid:{color:'#21262d'},beginAtZero:false};
  if(yMin!==yMax){yAxis.min=yMin;yAxis.max=yMax;}
  return new Chart(el(id).getContext('2d'),{
    type:'line',
    data:{labels:[],datasets:[{data:[],borderColor:col,backgroundColor:col+'33',pointRadius:0,borderWidth:1.5,tension:.1,fill:true}]},
    options:{animation:false,responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:4,bottom:4,left:0,right:4}},
      scales:{x:{display:false},y:yAxis},
      plugins:{legend:{display:false}}}
  });
}

var cS=mkC('chS','#58a6ff',0,0);
var cP=mkC('chP','#f0883e',-180,180);
var cW=mkC('chW','#a371f7',-255,255);
var cPw=mkC('chPw','#3fb950',0,0);

function pushChart(ch,v,t){
  if(!ch)return;
  ch.data.labels.push(t);
  ch.data.datasets[0].data.push(v);
  if(ch.data.labels.length>MAX){
    var n=ch.data.labels.length-MAX;
    ch.data.labels.splice(0,n);
    ch.data.datasets[0].data.splice(0,n);
  }
}

var FLUSH_MS=200;
var flushDirty=false;
setInterval(function(){
  if(!flushDirty)return;
  flushDirty=false;
  if(cS)cS.update('none');
  if(cP)cP.update('none');
  if(cW)cW.update('none');
  if(cPw)cPw.update('none');
},FLUSH_MS);

/* ── WebSocket ─────────────────────────────────────────────── */
var ws;
var modeUserOverride=false;
var modeOverrideTimer=null;
el('mode').onchange=function(){
  modeUserOverride=true;
  clearTimeout(modeOverrideTimer);
  modeOverrideTimer=setTimeout(function(){modeUserOverride=false;},8000);
};

function connect(){
  try{ws=new WebSocket('ws://'+location.hostname+'/ws');}catch(e){setTimeout(connect,2000);return;}
  ws.onopen=function(){st.textContent='Conectado';st.className='status ok';t0=Date.now();};
  ws.onclose=function(){st.textContent='Desconectado';st.className='status err';setTimeout(connect,2000);};
  ws.onerror=function(){ws.close();};
  ws.onmessage=function(e){
    try{
      var d=JSON.parse(e.data);
      var t=((Date.now()-t0)/1000).toFixed(1);
      var inaOk=d.ina_ok!==false;
      pushChart(cS,d.position_deg||0,t);
      pushChart(cP,d.pend_position_deg||0,t);
      pushChart(cW,d.pwm||0,t);
      pushChart(cPw,inaOk?(d.p_mw||0):null,t);   /* gap si el INA219 no responde */
      flushDirty=true;
      if(recording){
        rows.push({time_s:t,mode:d.mode,position_deg:d.position_deg,setpoint_deg:d.setpoint_deg,pend_position_deg:d.pend_position_deg,pwm:d.pwm,voltage_v:inaOk?d.v_bus:'',current_mA:inaOk?d.i_ma:'',power_mW:inaOk?d.p_mw:'',_ms:Date.now()});
      }
      if(d.gain_scheduling!==undefined)el('gs').value=d.gain_scheduling?'1':'0';
      if(d.mode!==undefined&&!modeUserOverride)el('mode').value=d.mode;
      if(d.position_deg!==undefined)el('rlInfo').textContent='θ:'+(+d.position_deg).toFixed(1)+'° α:'+(+d.pend_position_deg).toFixed(1)+'°';
    }catch(ex){}
  };
}
connect();
updateRecUI();

/* ── Commands ──────────────────────────────────────────────── */
function cmd(qs){
  modeUserOverride=false;
  clearTimeout(modeOverrideTimer);
  fetch('/cmd?'+qs).then(function(r){return r.json();}).then(function(d){
    if(d.mode!==undefined)el('mode').value=d.mode;
  }).catch(function(){});
}

/* ── Deep RL ───────────────────────────────────────────────── */
function rlCmd(qs){
  fetch('/rl_cmd?'+qs).catch(function(){});
}
function rlPoll(){
  fetch('/rl_state').then(function(r){return r.json();}).then(function(d){
    var th=(d.th*180/Math.PI).toFixed(1);
    var al=(d.al*180/Math.PI).toFixed(1);
    var thd=(d.thd*180/Math.PI).toFixed(1);
    var ald=(d.ald*180/Math.PI).toFixed(1);
    el('rlInfo').textContent='\u03b8:'+th+'\u00b0 \u03b1:'+al+'\u00b0 \u03b8\u0307:'+thd+' \u03b1\u0307:'+ald;
  }).catch(function(){el('rlInfo').textContent='Error de conexi\u00f3n';});
}

/* \u2500\u2500 OTA \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
function doOTA(){
  var f=el('otaFile').files[0];
  if(!f){el('otaSt').textContent='Eleg\u00ed un archivo .bin';return;}
  if(!f.name.endsWith('.bin')){el('otaSt').textContent='Solo archivos .bin';return;}
  var bar=el('otaFill'),s=el('otaSt');
  bar.style.width='0%';s.textContent='Subiendo...';
  var fd=new FormData();fd.append('firmware',f,f.name);
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/update',true);
  xhr.upload.onprogress=function(e){if(e.lengthComputable){bar.style.width=Math.round(e.loaded/e.total*100)+'%';}};
  xhr.onload=function(){
    if(xhr.status===200){bar.style.width='100%';s.textContent='\u00a1OK! Reiniciando ESP32...';}
    else{s.textContent='Error: '+xhr.status+' '+xhr.responseText;}
  };
  xhr.onerror=function(){s.textContent='Error de conexi\u00f3n';};
  xhr.send(fd);
}
</script>
</body>
</html>
